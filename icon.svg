<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SLAYER — a hard hat with a terminal prompt">
  <title>SLAYER</title>
  <!-- 安全帽剪影（工地）+ 终端提示符 >_（赛博）：帽身挖出提示符，帽檐里一道青灯当扫描线。 -->
  <rect width="512" height="512" fill="#111315"/>
  <defs>
    <mask id="prompt" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#ffffff"/>
      <path d="M198 204 250 246 198 288" fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="278" y="270" width="76" height="30" rx="15" fill="#000000"/>
    </mask>
  </defs>
  <g fill="#F5A524" mask="url(#prompt)">
    <path d="M134 314C134 224 166 138 256 138s122 86 122 176z"/>
    <rect x="54" y="298" width="404" height="76" rx="38"/>
  </g>
  <rect x="112" y="330" width="288" height="12" rx="6" fill="#2ED3B7"/>
</svg>
